<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E-Night">
  <meta name="theme-color" content="#06123a">
  <title>Election Night</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="frame">
      <div id="stage">
        <div class="atmosphere" aria-hidden="true"></div>
        <div id="screen"></div>
        <canvas id="ink" aria-hidden="true"></canvas>
        <div id="inkbar" hidden>
          <button type="button" id="ink-toggle" aria-pressed="true">Draw</button>
          <button type="button" id="ink-undo">Undo</button>
          <button type="button" id="ink-clear">Clear</button>
        </div>
      </div>
    </div>
    <button type="button" id="hot-reveal" aria-label="Show controls"></button>
    <button type="button" id="hot-sites" aria-label="Sites dashboard"></button>
    <div id="op" hidden></div>
    <div id="sheet" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
